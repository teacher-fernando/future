            background: rgba(255, 255, 255, 0.96);
            transform: translateY(-2px);
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
        }
        .glass-pill:active:not(:disabled) {
            transform: translateY(1px) scale(0.98);
        }
        .glass-pill:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #dice-canvas-container {

        @keyframes pulseRing {
            0% { transform: scale(0.85); opacity: 0.85; }

        }
        .animate-ring-burst {
            animation: pulseRing 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEnter {
            0% { opacity: 0; transform: translateY(14px) scale(0.985); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-card-in {
            animation: cardEnter 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes correctPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.04); }
            75% { transform: scale(0.99); }
            100% { transform: scale(1.01); }
        }
        .option-correct {
            animation: correctPop 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            color: #ffffff !important;
            border-color: #34d399 !important;
            box-shadow: 0 14px 34px rgba(16, 185, 129, 0.35) !important;
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
        }
        .option-wrong {
            animation: wrongShake 0.35s ease-in-out;
            background: rgba(244, 63, 94, 0.12) !important;
            border-color: rgba(244, 63, 94, 0.45) !important;

        /**
         * 2. SOUND SYNTHESIZER (Web Audio API)
         */
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }
            initContext() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playRollTick(pitchFactor = 1) {
                try {
                    this.initContext();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(190 * pitchFactor, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(75, this.ctx.currentTime + 0.045);
                    gain.gain.setValueAtTime(0.11, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.045);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.05);
                } catch (e) {}
            }
            playDiceLand() {
                try {
                    this.initContext();
                    if (!this.ctx) return;
                    const notes = [523.25, 659.25, 783.99];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        const startTime = this.ctx.currentTime + idx * 0.055;
                        osc.frequency.setValueAtTime(freq, startTime);
                        gain.gain.setValueAtTime(0.14, startTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.28);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(startTime);
                        osc.stop(startTime + 0.29);
                    });
                } catch (e) {}
            }
            playSuccessPoint() {
                try {
                    this.initContext();
                    if (!this.ctx) return;
                    const notes = [523.25, 659.25, 783.99, 1046.5];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        const startTime = this.ctx.currentTime + idx * 0.065;
                        osc.frequency.setValueAtTime(freq, startTime);
                        gain.gain.setValueAtTime(0.18, startTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.36);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(startTime);
                        osc.stop(startTime + 0.37);
                    });
                } catch (e) {}
            }
            playWrongTap() {
                try {
                    this.initContext();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(190, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(125, this.ctx.currentTime + 0.16);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.17);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.18);
                } catch (e) {}
            }
        }

        const sfx = new SoundEffects();

        /**
         * 3. SESSION STATE & RANDOMIZATION WITHOUT REPLACEMENT
         */
        const STORAGE_KEY = 'future_predictions_dice_v3_clean';

        function shuffleArray(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function createInitialCategoryState() {
            const catState = {};
            CATEGORIES.forEach(cat => {
                const allIds = QUESTION_BANK[cat.id].map(q => q.id);
                catState[cat.id] = {
                    shuffledQueue: shuffleArray(allIds),
                    usedIds: []
                };
            });
            return catState;
        }

        function createDefaultState() {
            return {
                categories: createInitialCategoryState(),
                currentCategoryId: 'choose_form',
                currentQuestionId: null
            };
        }

        let gameState = loadState();

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return createDefaultState();
                const parsed = JSON.parse(raw);
                if (!parsed || !parsed.categories) return createDefaultState();
                CATEGORIES.forEach(cat => {
                    if (!parsed.categories[cat.id] || !Array.isArray(parsed.categories[cat.id].shuffledQueue)) {
                        const allIds = QUESTION_BANK[cat.id].map(q => q.id);
                        parsed.categories[cat.id] = {
                            shuffledQueue: shuffleArray(allIds),
                            usedIds: []
                        };
                    }
                });
                return parsed;
            } catch (err) {
                return createDefaultState();
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
            } catch (err) {}
        }

        function drawNextActivityForCategory(categoryId) {
            const catTrack = gameState.categories[categoryId];
            if (!catTrack) return null;
            const unusedIds = catTrack.shuffledQueue.filter(id => !catTrack.usedIds.includes(id));
            if (unusedIds.length === 0) {
                gameState.currentCategoryId = categoryId;
                gameState.currentQuestionId = null;
                saveState();
                return null;
            }
            const nextId = unusedIds[0];
            catTrack.usedIds.push(nextId);
            gameState.currentCategoryId = categoryId;
            gameState.currentQuestionId = nextId;
            saveState();
            return QUESTION_BANK[categoryId].find(q => q.id === nextId) || null;
        }

        function resetSingleCategory(categoryId) {
            const allIds = QUESTION_BANK[categoryId].map(q => q.id);
            gameState.categories[categoryId] = {
                shuffledQueue: shuffleArray(allIds),
                usedIds: []
            };
            gameState.currentQuestionId = null;
            saveState();
        }

        /**
         * 4. GENUINE 3D WEBGL DICE ENGINE (Three.js)
         */
        const FACE_TARGET_EULERS = {
            0: { x: 0, y: -Math.PI / 2, z: 0 },  // Right (+X) -> Front (+Z)
            1: { x: 0, y: Math.PI / 2, z: 0 },   // Left (-X) -> Front (+Z)
            2: { x: Math.PI / 2, y: 0, z: 0 },   // Top (+Y) -> Front (+Z)
            3: { x: -Math.PI / 2, y: 0, z: 0 },  // Bottom (-Y) -> Front (+Z)
            4: { x: 0, y: 0, z: 0 },             // Front (+Z) -> Front (+Z)
            5: { x: 0, y: Math.PI, z: 0 }        // Back (-Z) -> Front (+Z)
        };

        let scene, camera, renderer, diceMesh, shadowMesh;
        let isRolling = false;
        let webglAvailable = true;
        let isDraggingDice = false;
        let prevPointer = { x: 0, y: 0 };

        let rollAnim = {
            active: false,
            startTime: 0,
            duration: 1900,
            startRot: { x: 0, y: 0, z: 0 },
            targetRot: { x: 0, y: 0, z: 0 },
            dropHeight: 8.5,
            selectedCategory: null,
            lastTickStep: -1
        };

        function drawMinimalistFaceSymbol(ctx, faceIndex, cx, cy) {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.94)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            switch (faceIndex) {
                case 0: // Eye lens
                    ctx.beginPath();
                    ctx.moveTo(cx - 52, cy);
                    ctx.quadraticCurveTo(cx, cy - 42, cx + 52, cy);
                    ctx.quadraticCurveTo(cx, cy + 42, cx - 52, cy);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(cx, cy, 14, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 1: // Blank line
                    ctx.beginPath();
                    ctx.moveTo(cx - 52, cy + 16);
                    ctx.lineTo(cx + 52, cy + 16);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(cx, cy - 12, 8, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 2: // Question curve
                    ctx.beginPath();
                    ctx.arc(cx, cy - 12, 22, Math.PI, 0, false);
                    ctx.quadraticCurveTo(cx + 22, cy + 6, cx, cy + 14);
                    ctx.lineTo(cx, cy + 22);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(cx, cy + 38, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 3: // Three dots
                    [-32, 0, 32].forEach(offset => {
                        ctx.beginPath();
                        ctx.arc(cx + offset, cy, 8, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    break;
                case 4: // Diverging choice paths
                    ctx.beginPath();
                    ctx.moveTo(cx, cy + 32);
                    ctx.lineTo(cx, cy + 4);
                    ctx.lineTo(cx - 34, cy - 26);
                    ctx.moveTo(cx, cy + 4);
                    ctx.lineTo(cx + 34, cy - 26);
                    ctx.stroke();
                    break;
                case 5: // Diamond star
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - 42);
                    ctx.quadraticCurveTo(cx, cy, cx + 42, cy);
                    ctx.quadraticCurveTo(cx, cy, cx, cy + 42);
                    ctx.quadraticCurveTo(cx, cy, cx - 42, cy);
                    ctx.quadraticCurveTo(cx, cy, cx, cy - 42);
                    ctx.closePath();
                    ctx.stroke();
                    break;
            }
            ctx.restore();
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function createCategoryFaceTexture(category) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, 512, 512);

            const grad = ctx.createLinearGradient(0, 0, 512, 512);
            grad.addColorStop(0, category.colorHex);
            grad.addColorStop(1, category.colorDarkHex);

            const pad = 20;
            const radius = 64;
            ctx.fillStyle = grad;
            roundRect(ctx, pad, pad, 512 - pad * 2, 512 - pad * 2, radius);
            ctx.fill();

            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
            roundRect(ctx, pad + 18, pad + 18, 512 - (pad + 18) * 2, 512 - (pad + 18) * 2, radius - 14);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.beginPath();
            ctx.arc(256, 182, 76, 0, Math.PI * 2);
            ctx.fill();

            drawMinimalistFaceSymbol(ctx, category.faceIndex, 256, 182);

            const lines = category.shortTitle.split('\n');
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '700 38px "Plus Jakarta Sans", "Inter", sans-serif';

            lines.forEach((line, idx) => {
                ctx.fillText(line, 256, 336 + idx * 50);
            });

            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            roundRect(ctx, 216, 432, 80, 6, 3);
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 4;
            return texture;
        }

        function initThreeDice() {
            const container = document.getElementById('dice-canvas-container');
            if (typeof THREE === 'undefined') {
                activateFallbackMode();
                return;
            }

            try {
                scene = new THREE.Scene();
                const width = container.clientWidth || 440;
                const height = container.clientHeight || 480;

                camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 100);
                camera.position.set(0, 0.55, 8.2);
                camera.lookAt(0, -0.25, 0);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                container.appendChild(renderer.domElement);

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.88);
                scene.add(ambientLight);

                const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.65);
                dirLight1.position.set(5, 9, 7);
                scene.add(dirLight1);

                const dirLight2 = new THREE.DirectionalLight(0xc4b5fd, 0.35);
                dirLight2.position.set(-6, -4, 4);
                scene.add(dirLight2);

                const materials = CATEGORIES.map(cat => new THREE.MeshStandardMaterial({
                    map: createCategoryFaceTexture(cat),
                    roughness: 0.24,
                    metalness: 0.06
                }));

                const geometry = new THREE.BoxGeometry(2.55, 2.55, 2.55);
                diceMesh = new THREE.Mesh(geometry, materials);

                const initialEuler = FACE_TARGET_EULERS[4];
                diceMesh.rotation.set(initialEuler.x + 0.16, initialEuler.y - 0.22, 0);
                diceMesh.position.y = -0.5;
                scene.add(diceMesh);

                const shadowGeo = new THREE.PlaneGeometry(3.4, 3.4);
                const shadowCanvas = document.createElement('canvas');
                shadowCanvas.width = 128;
                shadowCanvas.height = 128;
                const sCtx = shadowCanvas.getContext('2d');
                const sGrad = sCtx.createRadialGradient(64, 64, 8, 64, 64, 60);
                sGrad.addColorStop(0, 'rgba(30, 27, 75, 0.26)');
                sGrad.addColorStop(1, 'rgba(30, 27, 75, 0)');
                sCtx.fillStyle = sGrad;
                sCtx.fillRect(0, 0, 128, 128);

                const shadowTex = new THREE.CanvasTexture(shadowCanvas);
                const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });
                shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
                shadowMesh.rotation.x = -Math.PI / 2;
                shadowMesh.position.y = -2.0;
                scene.add(shadowMesh);

                setupDicePointerControls(renderer.domElement);
                window.addEventListener('resize', onResizeDiceCanvas);

                animateThreeLoop();
            } catch (err) {
                activateFallbackMode();
            }
        }

        function activateFallbackMode() {
            webglAvailable = false;
            const fb = document.getElementById('webgl-fallback');
            if (fb) fb.classList.remove('hidden');
        }

        function onResizeDiceCanvas() {
            if (!renderer || !camera) return;
            const container = document.getElementById('dice-canvas-container');
            if (!container) return;
            const w = container.clientWidth || 380;
            const h = container.clientHeight || 420;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function setupDicePointerControls(domElem) {
            let dragDistance = 0;

            domElem.addEventListener('pointerdown', (e) => {
                if (isRolling) return;
                isDraggingDice = true;
                dragDistance = 0;
                prevPointer = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDraggingDice || isRolling || !diceMesh) return;
                const dx = e.clientX - prevPointer.x;
                const dy = e.clientY - prevPointer.y;
                dragDistance += Math.hypot(dx, dy);
                diceMesh.rotation.y += dx * 0.009;
                diceMesh.rotation.x += dy * 0.009;
                prevPointer = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointerup', () => {
                if (isDraggingDice && dragDistance < 8 && !isRolling) {
                    triggerDiceRoll();
                }
                isDraggingDice = false;
            });
        }

        function getDropBounceHeight(t) {
            const n1 = 7.5625;
            const d1 = 2.75;
            let bounceProgress;
            if (t < 1 / d1) {
                bounceProgress = n1 * t * t;
            } else if (t < 2 / d1) {
                let t2 = t - 1.5 / d1;
                bounceProgress = n1 * t2 * t2 + 0.75;
            } else if (t < 2.5 / d1) {
                let t2 = t - 2.25 / d1;
                bounceProgress = n1 * t2 * t2 + 0.9375;
            } else {
                let t2 = t - 2.625 / d1;
                bounceProgress = n1 * t2 * t2 + 0.984375;
            }
            return 1 - bounceProgress;
        }

        function animateThreeLoop(now = performance.now()) {
            requestAnimationFrame(animateThreeLoop);
            if (!webglAvailable || !renderer || !scene || !camera) return;

            if (rollAnim.active && diceMesh) {
                const elapsed = now - rollAnim.startTime;
                const t = Math.min(elapsed / rollAnim.duration, 1);
                const easeRot = 1 - Math.pow(1 - t, 3.2);

                diceMesh.rotation.x = rollAnim.startRot.x + (rollAnim.targetRot.x - rollAnim.startRot.x) * easeRot;
                diceMesh.rotation.y = rollAnim.startRot.y + (rollAnim.targetRot.y - rollAnim.startRot.y) * easeRot;
                diceMesh.rotation.z = rollAnim.startRot.z + (rollAnim.targetRot.z - rollAnim.startRot.z) * easeRot;

                const heightFactor = getDropBounceHeight(t);
                const groundY = -0.5;
                diceMesh.position.y = groundY + heightFactor * rollAnim.dropHeight;

                if (shadowMesh) {
                    const shadowScale = Math.max(0.2, 1.08 - heightFactor * 0.85);
                    shadowMesh.scale.set(shadowScale, shadowScale, 1);
                    shadowMesh.material.opacity = Math.max(0.05, 0.95 - heightFactor * 0.9);
                }

                const tickStep = Math.floor(easeRot * 12);
                if (tickStep !== rollAnim.lastTickStep && t < 0.92) {
                    rollAnim.lastTickStep = tickStep;
                    sfx.playRollTick(0.85 + t * 0.45);
                }

                if (t >= 1) {
                    rollAnim.active = false;
                    diceMesh.rotation.set(rollAnim.targetRot.x, rollAnim.targetRot.y, rollAnim.targetRot.z);
                    diceMesh.position.y = -0.5;
                    if (shadowMesh) {
                        shadowMesh.scale.set(1, 1, 1);
                        shadowMesh.material.opacity = 1;
                    }
                    finishDiceRoll(rollAnim.selectedCategory);
                }
            } else if (diceMesh && !isDraggingDice) {
                diceMesh.position.y = -0.5 + Math.sin(now * 0.0022) * 0.06;
            }

            renderer.render(scene, camera);
        }

        function triggerDiceRoll() {
            if (isRolling) return;
            isRolling = true;

            const rollBtn = document.getElementById('btn-roll-dice');
            rollBtn.disabled = true;

            const availableCategories = CATEGORIES.filter(cat => {
                const track = gameState.categories[cat.id];
                return track && track.usedIds.length < 15;
            });

            const pool = availableCategories.length > 0 ? availableCategories : CATEGORIES;
            const chosenCategory = pool[Math.floor(Math.random() * pool.length)];

            if (!webglAvailable || !diceMesh) {
                sfx.playRollTick(1);
                setTimeout(() => {
                    document.getElementById('fallback-icon').textContent = chosenCategory.roman;
                    document.getElementById('fallback-title').textContent = chosenCategory.title;
                    document.getElementById('fallback-dice-face').style.backgroundColor = chosenCategory.colorHex;
                    finishDiceRoll(chosenCategory);
                }, 600);
                return;
            }

            const twoPi = Math.PI * 2;
            const curX = ((diceMesh.rotation.x % twoPi) + twoPi) % twoPi;
            const curY = ((diceMesh.rotation.y % twoPi) + twoPi) % twoPi;
            const curZ = ((diceMesh.rotation.z % twoPi) + twoPi) % twoPi;
            diceMesh.rotation.set(curX, curY, curZ);

            const baseTarget = FACE_TARGET_EULERS[chosenCategory.faceIndex];
            const spinsX = (3 + Math.floor(Math.random() * 2)) * twoPi;
            const spinsY = (3 + Math.floor(Math.random() * 2)) * twoPi;
            const spinsZ = (2 + Math.floor(Math.random() * 2)) * twoPi;

            diceMesh.position.y = -0.5 + 8.5;

            rollAnim = {
                active: true,
                startTime: performance.now(),
                duration: 1850,
                startRot: { x: curX, y: curY, z: curZ },
                targetRot: {
                    x: baseTarget.x + spinsX,
                    y: baseTarget.y + spinsY,
                    z: baseTarget.z + spinsZ
                },
                dropHeight: 8.5,
                selectedCategory: chosenCategory,
                lastTickStep: -1
            };
        }

        function finishDiceRoll(category) {
            sfx.playDiceLand();

            const ring = document.getElementById('dice-landing-ring');
            ring.classList.remove('hidden', 'animate-ring-burst');
            void ring.offsetWidth;
            ring.classList.add('animate-ring-burst');

            setTimeout(() => {
                const rollBtn = document.getElementById('btn-roll-dice');
                rollBtn.disabled = false;
                isRolling = false;

                const activity = drawNextActivityForCategory(category.id);
                openActivityModal(category, activity);
            }, 340);
        }

        /**
         * 5. ACTIVITY CARD & CONFETTI CELEBRATION
         */
        let timerInterval = null;
        let timerSecondsLeft = 30;
        let timerRunning = false;

        function resetTimer(seconds = 30) {
            clearInterval(timerInterval);
            timerRunning = false;
            timerSecondsLeft = seconds;
            updateTimerDisplay();
            const toggleBtn = document.getElementById('btn-timer-toggle');
            if (toggleBtn) toggleBtn.textContent = 'Start';
        }

        function toggleTimer() {
            const toggleBtn = document.getElementById('btn-timer-toggle');
            if (timerRunning) {
                clearInterval(timerInterval);
                timerRunning = false;
                toggleBtn.textContent = 'Resume';
            } else {
                if (timerSecondsLeft <= 0) timerSecondsLeft = 30;
                timerRunning = true;
                toggleBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    timerSecondsLeft--;
                    updateTimerDisplay();
                    if (timerSecondsLeft <= 0) {
                        clearInterval(timerInterval);
                        timerRunning = false;
                        toggleBtn.textContent = 'Reset';
                        sfx.playDiceLand();
                    }
                }, 1000);
            }
        }

        function updateTimerDisplay() {
            const disp = document.getElementById('timer-display');
            if (!disp) return;
            const mins = String(Math.floor(timerSecondsLeft / 60)).padStart(2, '0');
            const secs = String(timerSecondsLeft % 60).padStart(2, '0');
            disp.textContent = `${mins}:${secs}`;
        }

        function openActivityModal(category, questionObj) {
            const emptyView = document.getElementById('empty-question-view');
            const cardWrapper = document.getElementById('question-card-wrapper');
            const dotEl = document.getElementById('activity-color-dot');
            const titleEl = document.getElementById('activity-category-title');
            const counterEl = document.getElementById('activity-counter-badge');
            const exhaustedView = document.getElementById('exhausted-category-view');
            const activeView = document.getElementById('active-question-view');
            const timerWidget = document.getElementById('timer-widget');

            emptyView.classList.add('hidden');
            cardWrapper.classList.remove('hidden', 'animate-card-in');
            void cardWrapper.offsetWidth;
            cardWrapper.classList.add('flex', 'animate-card-in');

            if (dotEl) dotEl.style.backgroundColor = category.colorHex;
            titleEl.textContent = category.title;

            const catState = gameState.categories[category.id];
            const usedCount = catState ? catState.usedIds.length : 0;
            counterEl.textContent = `${String(usedCount).padStart(2, '0')} / 15`;

            resetTimer(30);
            if (category.id === 'continue_sentence') {
                timerWidget.classList.remove('hidden');
                timerWidget.classList.add('flex');
            } else {
                timerWidget.classList.add('hidden');
                timerWidget.classList.remove('flex');
            }

            if (!questionObj) {
                exhaustedView.classList.remove('hidden');
                exhaustedView.classList.add('flex');
                activeView.classList.add('hidden');
                document.getElementById('exhausted-cat-name').textContent = category.title;
                return;
            }

            exhaustedView.classList.add('hidden');
            exhaustedView.classList.remove('flex');
            activeView.classList.remove('hidden');

            document.getElementById('activity-prompt-text').textContent = questionObj.prompt;
            document.getElementById('activity-subprompt').textContent = questionObj.subprompt || '';

            const optionsContainer = document.getElementById('activity-options-container');
            optionsContainer.innerHTML = '';

            if (Array.isArray(questionObj.options) && questionObj.options.length > 0) {
                optionsContainer.classList.remove('hidden');
                optionsContainer.classList.add('grid');
                questionObj.options.forEach((optText, idx) => {
                    const optBtn = document.createElement('button');
                    optBtn.type = 'button';
                    optBtn.className = 'glass-pill text-slate-900 font-display font-semibold text-lg sm:text-xl py-4 px-6 rounded-2xl text-left flex items-center justify-between gap-3';
                    optBtn.innerHTML = `<span>${optText}</span><span class="opt-status-icon flex items-center"></span>`;
                    optBtn.addEventListener('click', (e) => handleOptionSelect(questionObj, idx, optBtn, optionsContainer, e));
                    optionsContainer.appendChild(optBtn);
                });
            } else {
                optionsContainer.classList.add('hidden');
                optionsContainer.classList.remove('grid');
            }
        }

        function launchConfettiBurst(originX, originY) {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const colors = ['#10b981', '#34d399', '#6366f1', '#a855f7', '#38bdf8', '#fbbf24'];
            const particles = [];

            for (let i = 0; i < 65; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 4 + Math.random() * 11;
                particles.push({
                    x: originX,
                    y: originY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 3.5,
                    size: 6 + Math.random() * 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.25,
                    alpha: 1
                });
            }

            function renderParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                particles.forEach(p => {
                    if (p.alpha <= 0.02) return;
                    alive = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.36;
                    p.vx *= 0.98;
                    p.rotation += p.vRot;
                    p.alpha -= 0.016;

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
                    ctx.restore();
                });

                if (alive) {
                    requestAnimationFrame(renderParticles);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            requestAnimationFrame(renderParticles);
        }

        function handleOptionSelect(questionObj, chosenIdx, clickedBtn, container, event) {
            const isCorrect = chosenIdx === questionObj.correctIndex;
            const iconSpan = clickedBtn.querySelector('.opt-status-icon');

            if (isCorrect) {
                sfx.playSuccessPoint();
                Array.from(container.children).forEach(btn => {
                    btn.classList.remove('option-wrong');
                });
                clickedBtn.classList.remove('option-correct');
                void clickedBtn.offsetWidth;
                clickedBtn.classList.add('option-correct');
                if (iconSpan) {
                    iconSpan.innerHTML = `<svg class="w-6 h-6 stroke-white" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                }

                const rect = clickedBtn.getBoundingClientRect();
                const cx = event?.clientX || (rect.left + rect.width / 2);
                const cy = event?.clientY || (rect.top + rect.height / 2);
                launchConfettiBurst(cx, cy);
            } else {
                sfx.playWrongTap();
                clickedBtn.classList.remove('option-wrong');
                void clickedBtn.offsetWidth;
                clickedBtn.classList.add('option-wrong');
                if (iconSpan) iconSpan.innerHTML = '';
            }
        }

        /**
         * 6. INITIALIZATION & EVENT LISTENERS
         */
        window.addEventListener('DOMContentLoaded', () => {
            initThreeDice();

            document.getElementById('btn-roll-dice').addEventListener('click', triggerDiceRoll);

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && document.activeElement.tagName !== 'BUTTON') {
                    e.preventDefault();
                    triggerDiceRoll();
                }
            });

            document.getElementById('btn-timer-toggle').addEventListener('click', toggleTimer);

            document.getElementById('btn-exhausted-replay-cat').addEventListener('click', () => {
                const catId = gameState.currentCategoryId;
                resetSingleCategory(catId);
                const cat = CATEGORIES.find(c => c.id === catId);
                const nextQ = drawNextActivityForCategory(catId);
                openActivityModal(cat, nextQ);
            });
        });
    </script>
</body>
